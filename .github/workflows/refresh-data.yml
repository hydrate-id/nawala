name: refresh-data

on:
  schedule:
    # daily 03:00 UTC — Komdigi list updates regularly
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: [self-hosted, macOS, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Refresh blocklist
        run: cargo run --release --example refresh

      - name: Commit if data changed
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --exit-code -- data/trustpositif.txt.gz; then
            echo "list unchanged, skipping commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add data/trustpositif.txt.gz
          git commit -m "chore: refresh data trustpositif"
          git push
          echo "committed & pushed: blocklist updated"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # blocklist is embedded at compile time (include_bytes!), so prod needs a redeploy
      - name: Deploy to Vercel
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_d6RzQIV110Ovvaz7cOD4SDmF
          VERCEL_PROJECT_ID: prj_f6WI4pKE9ZqdBAflhWUGuM8DW2U8
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
