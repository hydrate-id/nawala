[package]
name = "is-blocked"
version = "0.1.0"
edition = "2021"

[dependencies]
ureq = "2"
flate2 = "1"
vercel_runtime = { version = "2", features = ["axum"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
hyper = "1"
axum = "0.8"
tower = "0.5"

[[bin]]
name = "main"
path = "src/main.rs"

[[example]]
name = "refresh"
path = "examples/refresh.rs"


[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
